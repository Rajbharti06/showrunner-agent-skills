[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "showrunner-agent-skills"
version = "0.1.0"
description = "24 Agent Skills and a zero-dependency Python engine and MCP server for growing a channel on YouTube, Instagram, TikTok, Facebook, LinkedIn, X and Threads."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Raj Bharti" }]
keywords = ["agent-skills", "claude", "chatgpt", "mcp", "content-creation", "youtube", "instagram", "tiktok", "social-media", "creator"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: End Users/Desktop",
  "Topic :: Communications",
]
dependencies = []

[project.scripts]
showrunner = "showrunner.cli:main"
showrunner-mcp = "showrunner.mcp_server:main"

[project.urls]
Homepage = "https://github.com/Rajbharti06/showrunner-agent-skills"
Issues = "https://github.com/Rajbharti06/showrunner-agent-skills/issues"

[tool.setuptools.packages.find]
where = ["engine"]

[tool.setuptools.package-data]
showrunner = ["data/*.json", "data/playbooks/*.json"]
